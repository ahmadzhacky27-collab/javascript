<!-- 
    array : struktur data yang bisa menyimpan datanya lebih dari 1 
    -->

<script>
    let nama = ["Budi", "Laras", "Andi"] // 0, 1, 2
    const keranjang = ["Buah", "Sayuran", "Ikan"] // 0, 1, 2

    console.log(nama[0])
    console.log(nama[1])
    console.log(nama[2])
    console.log(keranjang[2])
    nama[2] = "Agung";
    console.log(nama);
    nama.push('Raka');
    nama.unshift("Rozak");
    console.log("nama baru", nama);

    //index
    const target = nama.indexOf("Budi");
    console.log(target);

    //spread operator : ...
    nama = [...nama, "Wawan"]
    nama = ["Wawan", ...nama]
    console.log(nama);

    // length: count (menghitung array)
    const total = nama.length
    const totalKeranjang = keranjang.length
    console.log(nama.length)


</script>
