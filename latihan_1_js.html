<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan</title>
</head>

<body>

    <script>
        // let = Nilainya bisa diubah, tapi tidak boleh di deklarasikan ulang
        // var = Nilainya bisa diubah
        // cons = nilainya tetap

        let nama = "AZ";
        nama = "tes";
        console.log(nama);

        var alamat = "Jakarta";
        var alamat = "Bogor";
        console.log(alamat);

        const nilaiTetap = 10;
        // nilaiTetap = 20;
        console.log(nilaiTetap);

        // Object & Immutability
        // Object
        const peserta = {
            nama: "Tono"
        };
        peserta.alamat = "Kp. Sawah";
        console.log(peserta);

        // Immutability : membuat object baru menggunakan spred  operator (...)
        const pesertaBaru = { ...peserta, nim: "123456" }
        console.log(pesertaBaru);

        // 1. STRING & TEMPLATE LITERALS
        const namaDepan = "Susi";
        const namaBelakang = "Pujiastuti";
        console.log(namaDepan + " " + namaBelakang);

        let literalsContoh = `
        Nama Depan    : ${namaDepan}
        Nama Belakang : ${namaBelakang}
        `;
        console.log(literalsContoh);

        // OPERATOR ARITMATIKA & ASSIGMENT
        // *, /, -, +
        let angka1 = 1;
        let angka2 = 1;
        console.log(angka1 + "*" + angka2 + "=" + angka1 * angka2);
        console.log(angka1 + ":" + angka2 + "=" + angka1 / angka2);
        console.log(angka1 + "+" + angka2 + "=" + parseInt(angka1 + angka2));
        console.log(angka1 + "-" + angka2 + "=" + parseInt(angka1 - angka2));
        console.log(angka1 + "+" + angka2 + "=" + parseFloat(angka1 + angka2));
        console.log(angka1 + "-" + angka2 + "=" + parseFloat(angka1 - angka2));

        let a = 7;
        a += 10; // a = a + 10
        console.log(a);

        // OPERATOR PERBANDINGAN & LOGIKA
        let user = "admin";
        let password = "12345678";

        if (user === "asdasd" && password === "asdasd") {
            console.log("LOGIN SUKSES");
        } else {
            console.log("GAGAL")
        }

        if (user === "admin" && password === "12345678") {
            console.log("LOGIN SUKSES");
        } else {
            console.log("GAGAL")
        }
        console.log("5 > 10 :", 5 > 10);
        console.log("10 > 10 :", 10 > 10);
        console.log("10 >= 10 :", 10 >= 10);
        console.log("5 < 10 :", 5 < 10);

        // IF TENARY
        let umur = 16;
        if (umur >= 17) {
            console.log("Dewasa");
        } else {
            console.log("Bocil");
        }
        let tenaryyy = (umur >= 17) ? "Dewasa" : "Bocil";
        console.log(tenaryyy);

        // Switch Case
        const username = "admin";
        switch (username) {
            case "pimpinan":
                console.log("ini pimpinan");
                break;
            case "kasir":
                console.log("ini kasir");
                break;
            case "admin":
                console.log("ini admin");
                break;
            default:
                break;
        }

        // let paket = 10;
        // let bogor = 2000;
        // let depok = 4000;
        // let other = 6000;

        // let biaya = 0;
        // let kotatujuan = "bogor";

        // if (kotatujuan === "bogor") {
        //     console.log(biaya = kotatujuan * bogor);
        // } else if (kotatujuan === "depok") {
        //     console.log(biaya = kotatujuan * depok);
        // } else {
        //     console.log(biaya = kotatujuan * other);
        // }

        const paket = 10;
        const kota = "asdas";
        if (kota === "bogor") {
            console.log("bogor :", paket * 2000);
        } else if (kota === "depok") {
            console.log("depok :", paket * 4000);
        } else {
            console.log("other :", paket * 6000);
        }

        // FUNCTION
        function demoScope() {
            if (true) {
                var varVariable = "Saya var (Function Scope)";
                var letVariable = "Saya let (Block Scope)";
                const constVariable = "Saya const (Block Scope)";
            }
            // console.log(varVariable);
            // console.log(letVariable);
            // console.log(constVariable);
        }
        demoScope();

        // Traditional Function Expression (ES5)
        const squareES5 = function (x) {
            return x * x;
        }
        console.log(squareES5(5));

        // ARROW FUNCTION (ES6) - EXPLICIT RETURN
        const squareES6 = (x) => {
            return x * x;
        }
        console.log(squareES6(2));

        // ARROW FUNCTION (ES6+) - IMPLICIT RETURN
        const squareES6Implicit = (x) => x * x;
        console.log(squareES6Implicit(5));

        // penggunaan pada method array
        const fruits = ["apel", "nanas", "durian"];
        const squareFruits = fruits.map((fruit) => fruit);
        console.log(squareFruits);
        console.log(squareFruits[0]);
        console.log(squareFruits[1]);
        console.log(squareFruits[2]);

        //looping for
        for (let index = 1; index < 5; index++) {
            console.log("Perulangan ke-" + index);
        }

        let no = 1;
        while (no <= 5) {
            console.log(`Ini Nomor Ke- ${no}`);
            no++;
        }

        let x = 1;
        do {
            console.log(`Nilai x = ${x}`);
            x++;
        } while (x <= 5);



    </script>

</body>

</html>
